services:
  app:
    build:
      context: app
    depends_on:
      firestore:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4317
      SPRING_CLOUD_GCP_FIRESTORE_EMULATOR_ENABLED: true
      SPRING_CLOUD_GCP_FIRESTORE_EMULATOR_HOST: firestore:8100
      SPRING_CLOUD_GCP_FIRESTORE_PROJECT_ID: task-list-project
      SPRING_PROFILES_ACTIVE: local
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      retries: 5
      start_period: 5s
      timeout: 10s
    ports:
      - "8080:8080"
    profiles:
      - run-app

  firestore:
    image: google/cloud-sdk:532.0.0-emulators
    command: >
      sh -c "gcloud beta emulators firestore start --host-port=0.0.0.0:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 5s
    ports:
      - "8100:8080"

  wiremock:
    image: wiremock/wiremock:3.13.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/__admin/mappings" ]
      interval: 30s
      retries: 5
      start_period: 5s
      timeout: 10s
    ports:
      - "8090:8080"
    volumes:
      - type: bind
        source: ./config/docker-compose/wiremock
        target: /home/wiremock
        read_only: true

  prometheus:
    image: prom/prometheus:v3.3.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    profiles:
      - observability
    volumes:
      - ./config/docker-compose/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.6.1
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    profiles:
      - observability
    volumes:
      - ./config/docker-compose/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana

  jaeger:
    image: jaegertracing/jaeger:2.6.0
    environment:
      COLLECTOR_OTLP_ENABLED: true
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

volumes:
  grafana-data:
