services:
  app:
    build:
      context: app
    depends_on:
      mongodb:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4317
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: local
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      retries: 5
      start_period: 5s
      timeout: 10s
    ports:
      - "8080:8080"
    profiles:
      - run-app

  mongodb:
    image: mongo:8.0.9
    environment:
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_ROOT_USERNAME: root
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://root:secret@localhost:27017/?authSource=admin --quiet
      interval: 30s
      retries: 5
      start_period: 5s
      timeout: 10s
    ports:
      - "27017:27017"

  wiremock:
    image: wiremock/wiremock:3.13.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/__admin/mappings" ]
      interval: 30s
      retries: 5
      start_period: 5s
      timeout: 10s
    ports:
      - "8090:8080"
    volumes:
      - type: bind
        source: ./config/docker-compose/wiremock
        target: /home/wiremock
        read_only: true

  prometheus:
    image: prom/prometheus:v3.3.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    profiles:
      - observability
    volumes:
      - ./config/docker-compose/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.6.1
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    profiles:
      - observability
    volumes:
      - ./config/docker-compose/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana

  jaeger:
    image: jaegertracing/jaeger:2.6.0
    environment:
      COLLECTOR_OTLP_ENABLED: true
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

volumes:
  grafana-data:
