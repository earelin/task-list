#cloud-config.yaml

runcmd:
  - sudo apt-get update
  - sudo apt install gnupg curl -q -y
  - curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
  - echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] http://repo.mongodb.org/apt/debian bookworm/mongodb-org/8.0 main" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
  - sudo apt-get install -y mongodb-org=8.0.9 mongodb-org-database=8.0.9 mongodb-org-server=8.0.9 mongodb-mongosh mongodb-org-shell=8.0.9 mongodb-org-mongos=8.0.9 mongodb-org-tools=8.0.9 mongodb-org-database-tools-extra=8.0.9
  - echo "Done"
