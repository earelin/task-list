name: Continuous Delivery
on:
  push:
    branches:
      - trunk
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle
          restore-keys: ${{ runner.os }}-gradle

      - name: Build
        run: ./gradlew --build-cache --configuration-cache build --info

      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@v2.2.0
        with:
          compose-flags: --profile run-app

      - name: Integration tests
        run: ./gradlew --build-cache --configuration-cache integrationTest --info

      - name: Acceptance tests
        run: ./gradlew --build-cache cucumber --info

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/gradle-jdk17@master
        continue-on-error: true
        env:
          DEBUG: "*snyk*"
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Lint dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: app
          file: app/Dockerfile
          framework: dockerfile
          quiet: true
          output_format: sarif
          output_file_path: build/reports/checkov/dockerfile.sarif

      - name: Lint pipelines
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .github/workflows
          download_external_modules: true
          framework: github_actions
          quiet: true
          output_format: sarif
          output_file_path: build/reports/checkov/pipelines.sarif

      - name: Lint terraform files
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          download_external_modules: true
          framework: terraform
          quiet: true
          output_format: sarif
          output_file_path: build/reports/checkov/terraform.sarif

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --build-cache --configuration-cache sonar --info
